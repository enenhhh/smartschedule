#AndroidIDE: enforce UTF-8 & locale for Gradle daemon
android.suppressUnsupportedCompileSdk=37,37.0
android.useAndroidX=true

# R8 完整模式：更激进的裁剪与优化（AGP 8 默认开启，这里显式声明）
android.enableR8.fullMode=true
# 更小的 R 类：只生成实际引用到的资源常量
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
kotlin.incremental=true

org.gradle.caching=true
org.gradle.jvmargs=-Xmx896m -XX:MaxMetaspaceSize=320m -Dfile.encoding\=UTF-8

# Gradle 默认对仓库连接【没有超时】：只要某个 maven 源能建立 TCP 连接却不回应，
# 依赖解析就会无限期挂住（表现为构建卡在 checkDebugAarMetadata 一动不动）。
# 阿里云镜像偶尔会这样，加上超时后会快速失败并自动回退到后面的源。
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.tentatives=2
systemProp.org.gradle.internal.repository.initial.backoff=500

systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8

# AGP 9: retain the existing Kotlin plugin/DSL during this release.
android.builtInKotlin=false
android.newDsl=false
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
